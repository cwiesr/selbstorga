# Auslöser für die Push-Erinnerungen: ruft alle 10 Minuten /api/push?cron=1 auf.
# Der Endpoint prüft selbst nach Berliner Zeit, was fällig ist, und sendet jede Erinnerung höchstens einmal pro Tag.
# Die App-Adresse steht unten in APP_URL; bei einer eigenen Domain hier anpassen (oder als Repository-Variable APP_URL setzen).
name: Erinnerungen
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fällige Erinnerungen senden
        env:
          APP_URL: ${{ vars.APP_URL || 'https://selbstorgachris.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 25 -H "x-cron-secret: ${CRON_SECRET}" "${APP_URL}/api/push?cron=1" || echo "Aufruf fehlgeschlagen"
